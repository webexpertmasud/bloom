<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Flower Details | Bloom & Co.</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head><body><div class="announcement"><div class="site-width py-2">Free Delivery on orders over AED 150</div></div><header class="main-header"><nav class="navbar site-width"><a class="brand" href="index.html"><span class="brand-mark"><i class="bi bi-flower1"></i></span><span>BLOOM & CO.<small>FLOWERS & GIFTS</small></span></a><a class="icon-button" href="cart.html"><i class="bi bi-bag"></i><b class="cart-count">0</b></a></nav></header><main class="site-width py-5"><p class="small text-secondary"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / Flower details</p><div class="row g-4 align-items-center" id="productDetails"></div><section class="section-block mt-5"><div class="section-heading"><h2>You may also love</h2><a href="shop.html">Shop all</a></div><div class="row g-3 product-grid" id="related"></div></section></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="assets/js/products.js"></script><script>let id=Number(new URLSearchParams(location.search).get('id')||1),p=PRODUCTS.find(x=>x.id===id)||PRODUCTS[0];document.title=p.name+' | Bloom & Co.';document.getElementById('productDetails').innerHTML=`<div class="col-md-6"><img src="${p.image}" alt="${p.name}" style="width:100%;max-height:510px;object-fit:cover;border-radius:10px;background:#faf5f4"></div><div class="col-md-6"><span class="eyebrow">${p.category}</span><h1 style="font:500 36px 'Playfair Display',serif;margin:12px 0">${p.name}</h1><div class="rating mb-3"><span class="stars">★★★★★</span> (${p.reviews} reviews)</div><p class="fs-4 fw-bold">AED ${p.price}</p><p class="text-secondary lh-lg">A thoughtfully arranged selection of beautiful fresh blooms, prepared with care and delivered to make their day feel special.</p><div class="d-flex gap-2 align-items-center mb-3"><label for="qty" class="small">Quantity</label><input id="qty" type="number" min="1" value="1" class="form-control" style="width:80px"></div><button class="btn btn-forest" onclick="let c=getCart(),q=Math.max(1,Number(document.getElementById('qty').value)),l=c.find(x=>x.id===p.id);if(l)l.qty+=q;else c.push({id:p.id,qty:q});saveCart(c);alert('Added to cart!')">Add to Cart</button> <a class="btn btn-outline-dark btn-sm py-2" href="cart.html">View Cart</a><hr><p class="small"><i class="bi bi-truck me-2"></i>Same day delivery may be available.</p><p class="small"><i class="bi bi-flower1 me-2"></i>Freshness promise with every order.</p></div>`;document.getElementById('related').innerHTML=PRODUCTS.filter(x=>x.id!==p.id).slice(0,4).map(productCard).join('');updateCartCount();</script></body></html>
