<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout | Bloom & Co.</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="main-header"><nav class="navbar site-width"><a class="brand" href="index.html"><span class="brand-mark"><i class="bi bi-flower1"></i></span><span>BLOOM & CO.<small>FLOWERS & GIFTS</small></span></a><a class="small" href="cart.html">← Back to cart</a></nav></header><main class="site-width py-5"><span class="eyebrow">ALMOST THERE</span><h1 style="font:500 34px 'Playfair Display',serif">Checkout</h1><form id="checkoutForm" class="row g-4 mt-2"><div class="col-lg-7"><div class="p-4 border rounded-3"><h2 class="fs-5 mb-3">Delivery information</h2><div class="row g-3"><div class="col-md-6"><label class="form-label">Full name *</label><input class="form-control" name="name" required></div><div class="col-md-6"><label class="form-label">Phone number *</label><input class="form-control" name="phone" type="tel" required></div><div class="col-12"><label class="form-label">Email address *</label><input class="form-control" name="email" type="email" required></div><div class="col-12"><label class="form-label">Delivery address *</label><input class="form-control" name="address" required></div><div class="col-md-6"><label class="form-label">City / Emirate *</label><input class="form-control" name="city" required></div><div class="col-md-6"><label class="form-label">Preferred delivery date</label><input class="form-control" name="date" type="date"></div><div class="col-12"><label class="form-label">Gift message (optional)</label><textarea class="form-control" name="message" rows="3"></textarea></div></div><hr><h2 class="fs-5">Payment method</h2><div class="form-check"><input class="form-check-input" type="radio" name="payment" checked id="cod" value="Cash on Delivery"><label class="form-check-label" for="cod">Cash on Delivery</label></div><p class="small text-secondary mt-2">Demo checkout: submit opens WhatsApp with your order details. The order is not stored on a server.</p><button class="btn btn-forest mt-3" type="submit">Place Order via WhatsApp</button></div></div><div class="col-lg-5"><div class="p-4 rounded-3" style="background:#faf5f4"><h2 class="fs-5">Your order</h2><div id="checkoutSummary" class="py-3"></div><div class="d-flex justify-content-between border-top pt-3"><b>Total</b><b id="checkoutTotal">AED 0</b></div></div></div></form></main><script src="assets/js/products.js"></script><script>let cart=getCart();function renderSummary(){let sum=0;document.getElementById('checkoutSummary').innerHTML=cart.map(l=>{let p=PRODUCTS.find(x=>x.id===l.id);sum+=p.price*l.qty;return `<div class="d-flex justify-content-between gap-2 small mb-2"><span>${p.name} × ${l.qty}</span><b>AED ${p.price*l.qty}</b></div>`}).join('')||'<p class="small">Your cart is empty. <a href="shop.html">Shop flowers</a>.</p>';document.getElementById('checkoutTotal').textContent='AED '+sum.toFixed(2)}document.getElementById('checkoutForm').addEventListener('submit',e=>{e.preventDefault();if(!cart.length){alert('Your cart is empty.');return}let f=new FormData(e.target),lines=cart.map(l=>{let p=PRODUCTS.find(x=>x.id===l.id);return `${p.name} x ${l.qty} — AED ${p.price*l.qty}`}).join('%0A'),msg=`New Bloom & Co. Order%0A${encodeURIComponent(lines)}%0ATotal: ${encodeURIComponent(document.getElementById('checkoutTotal').textContent)}%0AName: ${encodeURIComponent(f.get('name'))}%0APhone: ${encodeURIComponent(f.get('phone'))}%0AEmail: ${encodeURIComponent(f.get('email'))}%0AAddress: ${encodeURIComponent(f.get('address')+', '+f.get('city'))}%0ADelivery date: ${encodeURIComponent(f.get('date')||'Not specified')}%0APayment: Cash on Delivery%0AGift message: ${encodeURIComponent(f.get('message')||'None')}`;let order={id:'BC'+Date.now().toString().slice(-7),status:'Verification',created:new Date().toLocaleString(),items:cart,customer:{name:f.get('name'),phone:f.get('phone'),email:f.get('email'),address:f.get('address')+', '+f.get('city')},total:document.getElementById('checkoutTotal').textContent};let orders=JSON.parse(localStorage.getItem('bloomOrders')||'[]');orders.push(order);localStorage.setItem('bloomOrders',JSON.stringify(orders));localStorage.setItem('bloomLastOrder',JSON.stringify(order));window.open('https://wa.me/?text='+msg,'_blank');alert('Order details prepared for WhatsApp. Please send the message to complete the request.');location.href='tracking.html'});renderSummary();</script></body></html>
