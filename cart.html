<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your Cart | Bloom & Co.</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="main-header"><nav class="navbar site-width"><a class="brand" href="index.html"><span class="brand-mark"><i class="bi bi-flower1"></i></span><span>BLOOM & CO.<small>FLOWERS & GIFTS</small></span></a><a class="icon-button" href="shop.html">Continue shopping</a></nav></header><main class="site-width py-5"><span class="eyebrow">YOUR FLOWERS, YOUR WAY</span><h1 style="font:500 34px 'Playfair Display',serif" class="my-2">Shopping Cart</h1><div class="row g-4 mt-2"><div class="col-lg-8" id="cartItems"></div><div class="col-lg-4"><div class="p-4 rounded-3" style="background:#faf5f4"><h2 class="fs-5 fw-bold">Order Summary</h2><div class="d-flex justify-content-between py-3"><span>Subtotal</span><b id="subtotal">AED 0</b></div><p class="small text-secondary">Delivery fees, if applicable, are confirmed at checkout.</p><label class="form-label small" for="promo">Promo code</label><div class="input-group mb-3"><input id="promo" class="form-control" placeholder="Enter code"><button id="applyPromo" class="btn btn-outline-dark">Apply</button></div><div class="d-flex justify-content-between border-top pt-3 mb-3"><b>Total</b><b id="total">AED 0</b></div><a href="checkout.html" class="btn btn-forest w-100">Proceed to Checkout</a><p id="promoMessage" class="small mt-2 mb-0"></p></div></div></div></main><script src="assets/js/products.js"></script><script>let discount=0;function money(n){return 'AED '+n.toFixed(2)}function renderCart(){let cart=getCart(),el=document.getElementById('cartItems');if(!cart.length){el.innerHTML='<div class="p-5 text-center rounded-3" style="background:#faf5f4"><i class="bi bi-bag-heart fs-1" style="color:#df6688"></i><h2 class="fs-5 mt-3">Your cart is waiting for flowers</h2><a href="shop.html" class="btn btn-forest mt-2">Explore Flowers</a></div>'}else{el.innerHTML=cart.map(line=>{let p=PRODUCTS.find(x=>x.id===line.id);return `<div class="d-flex gap-3 align-items-center border-bottom py-3"><img src="${p.image}" alt="${p.name}" style="width:95px;height:100px;object-fit:cover;border-radius:7px;background:#faf5f4"><div class="flex-grow-1"><b>${p.name}</b><p class="small mt-1 mb-2">AED ${p.price}</p><div class="d-flex align-items-center gap-2"><button class="btn btn-sm btn-outline-secondary" onclick="changeQty(${p.id},-1)">−</button><span>${line.qty}</span><button class="btn btn-sm btn-outline-secondary" onclick="changeQty(${p.id},1)">+</button><button class="btn btn-sm text-danger" onclick="removeItem(${p.id})">Remove</button></div></div><b>AED ${(p.price*line.qty).toFixed(2)}</b></div>`}).join('')}let sub=cart.reduce((s,l)=>s+PRODUCTS.find(p=>p.id===l.id).price*l.qty,0);document.getElementById('subtotal').textContent=money(sub);document.getElementById('total').textContent=money(sub*(1-discount));updateCartCount()}function changeQty(id,d){let c=getCart(),l=c.find(x=>x.id===id);if(l)l.qty+=d;c=c.filter(x=>x.qty>0);saveCart(c);renderCart()}function removeItem(id){saveCart(getCart().filter(x=>x.id!==id));renderCart()}document.getElementById('applyPromo').onclick=()=>{let code=document.getElementById('promo').value.trim().toUpperCase();discount=code==='BLOOM10'?.1:0;document.getElementById('promoMessage').textContent=discount?'10% discount applied!':'Try BLOOM10 for a demo discount.';renderCart()};renderCart();</script></body></html>
