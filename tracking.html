<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Order Tracking | Bloom & Co.</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="main-header"><nav class="navbar site-width"><a class="brand" href="index.html"><span class="brand-mark"><i class="bi bi-flower1"></i></span><span>BLOOM & CO.<small>FLOWERS & GIFTS</small></span></a><a class="icon-button" href="shop.html">Shop</a></nav></header><main class="site-width py-5"><span class="eyebrow">WE'RE HERE TO HELP</span><h1 style="font:500 34px 'Playfair Display',serif">Order Tracking</h1><p class="text-secondary">Check your recent demo orders and status.</p><div id="orders" class="mt-4"></div></main><script src="assets/js/products.js"></script><script>let orders=JSON.parse(localStorage.getItem('bloomOrders')||'[]'),root=document.getElementById('orders');function render(){if(!orders.length){root.innerHTML='<div class="p-5 text-center rounded-3" style="background:#faf5f4"><i class="bi bi-box-seam fs-1" style="color:#df6688"></i><h2 class="fs-5 mt-3">No orders yet</h2><a class="btn btn-forest mt-2" href="shop.html">Shop flowers</a></div>';return}root.innerHTML=orders.slice().reverse().map((o,i)=>`<div class="border rounded-3 p-3 mb-3"><div class="d-flex justify-content-between flex-wrap gap-2"><div><b>Order #${o.id}</b><p class="small text-secondary mb-1">${o.created||''}</p><p class="small mb-1">${o.customer?.name||'Customer'} · ${o.customer?.phone||''}</p></div><div><label class="small d-block mb-1">Status</label><select class="form-select form-select-sm" onchange="changeStatus('${o.id}',this.value)"><option ${o.status==='Verification'?'selected':''}>Verification</option><option ${o.status==='Delivered'?'selected':''}>Delivered</option><option ${o.status==='Cancelled'?'selected':''}>Cancelled</option></select></div></div><div class="small mt-2">${(o.items||[]).map(l=>{let p=PRODUCTS.find(x=>x.id===l.id);return `${p?.name||'Flower'} × ${l.qty}`}).join(' · ')}</div><b class="d-block mt-2">${o.total||''}</b></div>`).join('')}function changeStatus(id,status){orders=orders.map(o=>o.id===id?{...o,status}:o);localStorage.setItem('bloomOrders',JSON.stringify(orders));render()}render();</script></body></html>
